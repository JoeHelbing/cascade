[workspace]
authors = ["Joe Helbing <joehelbing@gmail.com>"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "cascade"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build-cpu = "mojo build mojo_cpu.mojo -o build/mojo_cpu"
build-gpu = "mojo build mojo_gpu.mojo -o build/mojo_gpu"
run-cpu = { cmd = "build/mojo_cpu", depends-on = ["build-cpu"] }
run-gpu = { cmd = "build/mojo_gpu", depends-on = ["build-gpu"] }
validate-cpu = "uv run autoresearch/validation/run_pipeline.py --stage cpu"
validate-gpu = "uv run autoresearch/validation/run_pipeline.py --stage gpu"
validate = "uv run autoresearch/validation/run_pipeline.py --stage all"

[dependencies]
mojo = ">=0.26.2.0,<0.27"
