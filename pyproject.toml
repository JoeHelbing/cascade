[project]
name = "cascade"
version = "0.1.0"
description = "Resistance Cascade ABM with Python reference, Mojo CPU port, and Mojo GPU kernel"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mesa==1.2.1",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "pyarrow>=15",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.12", "plotly>=5"]
analysis = ["statsmodels>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["original_python/resistance_cascade"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
